[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-amm-slippage-guard"
version = "0.1.0"
description = "Compute constant-product swap execution and reject quotes outside user-defined price-impact and output bounds."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-amm-slippage-guard = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
